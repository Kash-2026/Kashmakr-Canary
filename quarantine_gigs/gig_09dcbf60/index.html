<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bond Price & Yield to Maturity Calculator</title>
    <style>
        body { font-family: Arial, sans-serif; }
       .container { max-width: 600px; margin: 0 auto; padding: 20px; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; }
        input[type="number"] { width: 100%; padding: 8px; }
        button { padding: 10px 20px; background-color: #4CAF50; color: white; border: none; cursor: pointer; }
        button:hover { background-color: #45a049; }
        .result { margin-top: 20px; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Bond Price & Yield to Maturity Calculator</h1>
        <div class="form-group">
            <label for="faceValue">Face Value ($):</label>
            <input type="number" id="faceValue" step="0.01" required>
        </div>
        <div class="form-group">
            <label for="couponRate">Coupon Rate (%):</label>
            <input type="number" id="couponRate" step="0.01" required>
        </div>
        <div class="form-group">
            <label for="yearsToMaturity">Years to Maturity:</label>
            <input type="number" id="yearsToMaturity" required>
        </div>
        <div class="form-group">
            <label for="marketRate">Market Rate (%):</label>
            <input type="number" id="marketRate" step="0.01" required>
        </div>
        <button onclick="calculateBond()">Calculate</button>
        <div class="result" id="result"></div>
    </div>
    <script src="index.js"></script>
</body>
</html>
