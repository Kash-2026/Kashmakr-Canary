import financial_engine as fe
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Bond Price & Yield to Maturity Calculator</title>
    <style>
        body { font-family: Arial, sans-serif; }
       .container { max-width: 600px; margin: 0 auto; padding: 20px; }
       .form-group { margin-bottom: 15px; }
       .form-group label { display: block; margin-bottom: 5px; }
       .form-group input { width: 100%; padding: 8px; box-sizing: border-box; }
       .btn { padding: 10px 20px; background-color: #007BFF; color: white; border: none; cursor: pointer; }
       .result { margin-top: 20px; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Bond Price & Yield to Maturity Calculator</h1>
        <div class="form-group">
            <label for="faceValue">Face Value ($)</label>
            <input type="number" id="faceValue" required>
        </div>
        <div class="form-group">
            <label for="couponRate">Coupon Rate (%)</label>
            <input type="number" id="couponRate" step="0.01" required>
        </div>
        <div class="form-group">
            <label for="yearsToMaturity">Years to Maturity</label>
            <input type="number" id="yearsToMaturity" required>
        </div>
        <div class="form-group">
            <label for="marketRate">Market Rate (%)</label>
            <input type="number" id="marketRate" step="0.01" required>
        </div>
        <button class="btn" onclick="calculate()">Calculate</button>
        <div class="result" id="result"></div>
    </div>
    <script>
        function calculate() {
            const faceValue = document.getElementById('faceValue').value;
            const couponRate = document.getElementById('couponRate').value / 100;
            const yearsToMaturity = document.getElementById('yearsToMaturity').value;
            const marketRate = document.getElementById('marketRate').value / 100;

            const bondPrice = fe.calculate_bond_price(faceValue, couponRate, yearsToMaturity, marketRate);
            const ytm = fe.calculate_ytm(faceValue, couponRate, yearsToMaturity, bondPrice);

            document.getElementById('result').innerHTML = `
                <p>Bond Price: $${bondPrice.toFixed(2)}</p>
                <p>Yield to Maturity: ${ytm.toFixed(2)}%</p>
            `;
        }
    </script>
</body>
</html>
