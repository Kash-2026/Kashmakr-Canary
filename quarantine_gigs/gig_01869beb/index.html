<!DOCTYPE html>

  <style>

    }
    h1 {
      margin: 0.75rem 0 0.5rem 0;

    }
    .tags-container {
      display: flex;

    }
    .toggle-label {
      font-size: 0.9rem;
      color: var(--muted);
      cursor: pointer;
    }
    .toggle-label.active {
      color: var(--text);
      font-weight: 600;
    }
    .switch {
      position: relative;
      display: inline-block;
      width: 48px;
      height: 26px;
    }
    .switch input { opacity: 0; width: 0; height: 0; }
    .slider {
      position: absolute;
      cursor: pointer;
      top: 0; left: 0; right: 0; bottom: 0;
      background-color: #334155;
      transition: .3s;
      border-radius: 26px;
    }
    .slider:before {
      position: absolute;
      content: "";
      height: 18px;
      width: 18px;
      left: 4px;
      bottom: 4px;
      background-color: white;
      transition: .3s;
      border-radius: 50%;
    }
    input:checked + .slider {
      background-color: #6366f1;
    }
    input:checked + .slider:before {
      transform: translateX(22px);
    }
    .discount-badge {
      background: #10b981;
      color: #064e3b;
      font-weight: 700;
      font-size: 0.7rem;
      padding: 2px 6px;
      border-radius: 9999px;
      display: inline-block;

    .price-display {
      margin: 1rem 0;

    .amount { font-size: 3rem; font-weight: 800; color: #f8fafc; }
    .period { font-size: 0.95rem; color: #94a3b8; margin-left: 4px; }
    .feature-list {
      list-style: none;
      padding: 0;

      text-align: left;
    }
    .feature-list li {
      padding: 0.4rem 0;

      font-size: 0.95rem;
      display: flex;
      gap: 0.5rem;
    }
    .check { color: #10b981; font-weight: bold; }
    .cta-btn {
      width: 100%;
      background: #6366f1;
      color: white;
      border: none;
      border-radius: 8px;
      padding: 0.75rem;
      font-weight: 600;
      font-size: 1rem;
      cursor: pointer;
      transition: background 0.2s;
    }
    .cta-btn:hover { background: #4f46e5; }

</head>
<body>
  <div class="container">
    <div class="card">
      <span class="badge">Python / Backend Microservice</span>
      <h1>Build a on-page seo optimizer in Python 3.12: scores an arti</h1>
      <div class="tags-container">
        <span class="file-tag">README.md</span><span class="file-tag">requirements.txt</span><span class="file-tag">seo_optimizer.py</span><span class="file-tag">test_seo_optimizer.py</span>
      </div>
    </div>

    

    <div class="card">
      <div class="tabs-bar" id="tabs-bar">
        <button class="tab-btn active" onclick="showFile('README.md')">README.md</button><button class="tab-btn" onclick="showFile('requirements.txt')">requirements.txt</button><button class="tab-btn" onclick="showFile('seo_optimizer.py')">seo_optimizer.py</button><button class="tab-btn" onclick="showFile('test_seo_optimizer.py')">test_seo_optimizer.py</button>
      </div>
      <div id="editor-container">
        <pre><code id="code-view"># SEO Optimizer

This Python module scores an article based on SEO rules and returns prioritized edit suggestions.

## Installation</code></pre>
      </div>
    </div>
  </div>

  <script>
    const FILES = {"seo_optimizer.py": "import re\nfrom collections import Counter\nfrom typing import List, Tuple\n\ndef score_article(article: str, target_keyword: str, metadata_rules: dict) -> Tuple[int, List[str]]:\n    \"\"\"\n    Scores an article based on SEO rules and returns prioritized edits.\n    \n    Parameters:\n    - article: The article content as a string.\n    - target_keyword: The target keyword to optimize for.\n    - metadata_rules: A dictionary containing SEO rules.\n    \n    Returns:\n    - score: An integer representing the SEO score.\n    - edits: A list of prioritized edit suggestions.\n    \"\"\"\n    score = 0\n    edits = []\n    \n    # Rule 1: Keyword density\n    keyword_density = article.lower().count(target_keyword.lower()) / len(article.split())\n    if keyword_density < metadata_rules.get('min_keyword_density', 0.01):\n        score -= 10\n        edits.append(f\"Increase usage of '{target_keyword}' in the article.\")\n    \n    # Rule 2: Title tag\n    if not re.search(f\"<title>.*{target_keyword}.*</title>\", article, re.IGNORECASE):\n        score -= 5\n        edits.append(f\"Include '{target_keyword}' in the title tag.\")\n    \n    # Rule 3: Meta description\n    if not re.search(f\"<meta.*description.*{target_keyword}.*>\", article, re.IGNORECASE):\n        score -= 5\n        edits.append(f\"Include '{target_keyword}' in the meta description.\")\n    \n    # Rule 4: Header tags\n    header_tags = re.findall(r\"<h[1-6]>.*</h[1-6]>\", article, re.IGNORECASE)\n    header_keyword_count = sum(target_keyword.lower() in tag.lower() for tag in header_tags)\n    if header_keyword_count == 0:\n        score -= 5\n        edits.append(f\"Include '{target_keyword}' in at least one header tag.\")\n    \n    # Rule 5: Alt text for images\n    alt_texts = re.findall(r'<img.*alt=\"([^\"]+)\".*>', article, re.IGNORECASE)\n    alt_keyword_count = sum(target_keyword.lower() in text.lower() for text in alt_texts)\n    if alt_keyword_count == 0:\n        score -= 5\n        edits.append(f\"Include '{target_keyword}' in the alt text of at least one image.\")\n    \n    return score, edits", "test_seo_optimizer.py": "```", "README.md": "# SEO Optimizer\n\nThis Python module scores an article based on SEO rules and returns prioritized edit suggestions.\n\n## Installation", "requirements.txt": "## Usage"};

    function showFile(filename) {
      const content = FILES[filename] || "";
      const codeView = document.getElementById("code-view");
      if (codeView) codeView.textContent = content;

      const buttons = document.querySelectorAll(".tab-btn");
      buttons.forEach(btn => {
        if (btn.textContent === filename) {
          btn.classList.add("active");
        } else {
          btn.classList.remove("active");
        }
      });
    }

    const toggle = document.getElementById("billing-toggle");
    if (toggle) {
      toggle.addEventListener("change", function() {
        const isAnnual = this.checked;
        const amount = document.getElementById("price-amount");
        const period = document.getElementById("price-period");
        const mLabel = document.getElementById("monthly-label");
        const aLabel = document.getElementById("annual-label");
        if (isAnnual) {
          if (amount) amount.textContent = "290";
          if (period) period.textContent = "/year";
          if (mLabel) mLabel.classList.remove("active");
          if (aLabel) aLabel.classList.add("active");
        } else {
          if (amount) amount.textContent = "29";
          if (period) period.textContent = "/month";
          if (mLabel) mLabel.classList.add("active");
          if (aLabel) aLabel.classList.remove("active");
        }
      });
    }
  </script>
</body>
</html>
