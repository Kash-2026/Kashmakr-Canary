name: Kashmakr Cloud Canary Run

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:
    inputs:
      batch_args:
        description: 'Arguments or target IDs for the run'
        required: false
        default: '--first 5'

jobs:
  canary-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip'

    - name: Install System & Browser Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt || true
        pip install pytest playwright fastapi uvicorn boto3 fastmcp \
                      sqlalchemy scikit-learn numpy
        playwright install chromium --with-deps

    - name: Run Cloud Headless Canary Suite
      env:
        KM_SKIP_RAM_DISK_PROVISION: "1"
        CI: "true"
        AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
        AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        AWS_DEFAULT_REGION: ${{ secrets.AWS_DEFAULT_REGION || 'us-east-1' }}
      run: |
        echo "Starting cloud harness verification..."
        python -m pytest Engine/ -q --maxfail=5 || true

    - name: Upload Canary Run Artifacts
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: canary-run-reports
        path: |
          Engine/outputs/
          Engine/fresh_prompts/PILOT_RESULTS.json
          Engine/fresh_prompts/PILOT_RUN.log
